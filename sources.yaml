- id: pecc-events
  tier: 2
  kind: "html:pecc"
  url: "https://www.pecc.org/event-calendar/upcoming-events"
  auto_accept: false
  sectors: [foreign_policy, economy, trade]
  actors: [APEC, ASEAN]
  timezone: Asia/Singapore
  notes: >-
    The Asia-Pacific multilateral cluster (#39) — APEC ministerials, the ASEAN
    summit, G20 and COP, all in one rolling forward calendar. Wired less for
    what it adds today (it listed 8 events on 2026-08-11, of which the store
    already held 6) than for what it stops: the multilateral layer is
    otherwise entirely hand-added, and nothing else would ever fill it for a
    coming year.
    TWO-HOP by necessity — the listing has NO JSON-LD and renders dates as
    prose; the per-event pages each carry one schema.org Event with ISO dates.
    The item url is therefore the detail page, not the listing: verify_strings
    must be findable where the JSON-LD actually lives.
    The JSON-LD startDate carries a spurious wall-clock time (a CMS stamp —
    the 49th ASEAN Summit reads 11:20+08:00), so the parser keeps the date
    only and items land all-day.
    Not whitelisted: everything runs the gate. Volume is ~8 items, so no
    prefilter — the classifier cost is negligible and a prefilter here would
    just be another thing to get wrong.
    If the listing 404s, re-discover it from the site nav: the path moved from
    /event-calendar to /event-calendar/upcoming-events between 2026-08-03 and
    2026-08-11, which is what this issue's original URL recorded.

- id: ep-opendata-agenda
  tier: 1
  kind: "api:ep-opendata"
  url: "https://data.europarl.europa.eu/api/v2/meetings"
  auto_accept: false
  sectors: [eu]
  actors: [European Parliament]
  timezone: Europe/Brussels
  notes: >-
    The EP's own Open Data API (#64) — the only route to agenda-level detail.
    ep-plenary-ical emits part-session blocks and structurally cannot carry
    what happens inside one, which is why SOTEU 2026 was missing (#63).
    SCOPE IS NARROW ON PURPOSE: KEY DEBATE items only. The September 2026
    part-session carried 65 agenda items across four sitting days, of which
    exactly one was a KEY DEBATE (the State of the Union). Ordinary debates
    and votes belong on the part-session record as enrichment, which needs
    the cross-source duplicate question (#68) settled first.
    The EP publishes ONE part-session's draft agenda at a time — every
    sitting beyond the next returns 204, so the parser only probes a 60-day
    horizon. It also asks for NEXT year's sittings every run: the API held
    2020-2026 on 2026-08-11 and 204s for 2027, so this is what makes the
    year roll over on a sweep instead of needing a human to notice.
    ?format=application%2Fld%2Bjson is load-bearing everywhere, evidence URLs
    included: the API content-negotiates to RDF/XML and the fetcher sends no
    Accept header, so evidence stored against a bare URL could never match.
    www.europarl.europa.eu is UA-walled (202, zero bytes) but this host and
    oeil are not — do not blacklist the domain.

- id: ep-opendata-items
  tier: 1
  kind: "api:ep-opendata-items"
  url: "https://data.europarl.europa.eu/api/v2/meetings"
  auto_accept: false
  enrich_actor: European Parliament
  prefilter_keywords:
    - china
    - chinese
    - taiwan
    - hong kong
    - indo-pacific
    - asia
    - trade
    - tariff
    - customs
    - anti-dumping
    - anti-subsidy
    - cbam
    - carbon border
    - export control
    - dual-use
    - semiconductor
    - critical raw material
    - economic security
    - foreign direct investment
    - screening
    - human rights
    - sanction
    - foreign affairs
    - foreign policy
    - security and defence
    # Geo and actor terms (review, 2026-08-11). Every one of these appears in a
    # real adopted EP title that matched none of the keywords above: the 2022
    # Uyghur/Xinjiang urgency, the 2023 Tibet urgency, the Anti-Coercion
    # Instrument ("economic coercion" is not "economic security"), and the
    # forced-labour import ban. Deliberately NOT adding bare "foreign" or
    # "security": the reason this prefilter exists is that the classifier sits
    # at 0.90 against a 0.95 bar and rejects nothing, so broad tokens put the
    # ~50-item queue straight back.
    - uyghur
    - xinjiang
    - tibet
    - taiwanese
    - forced labour
    - coercion
    - anti-coercion
    - supply chain
    - 5g
    - cybersecurity
  sectors: [eu]
  actors: [European Parliament]
  timezone: Europe/Brussels
  notes: >-
    Ordinary plenary debates and votes (#69) — the bulk of an EP agenda, and
    where China resolutions, trade-agreement consents and human-rights
    urgencies actually get decided. The September 2026 part-session carried 65
    items across four sitting days.
    ENRICHMENT, not events: enrich_actor attaches an accepted item to the
    existing part-session record as a note line plus a corroborating source,
    the Bundesrat TOP pattern. A vote is not a meeting — it is what happens
    inside one.
    Deliberately a SECOND source over the same API rather than a flag on
    ep-opendata-agenda: the two dispositions are configured per source, and
    KEY DEBATEs must stay standalone timed events (SOTEU is the example). The
    extra fetches are the same handful of URLs.
    KEY DEBATE children are excluded here by the parser, or SOTEU would land
    both in the calendar and in the part-session's note.
    PREFILTER IS LOAD-BEARING HERE, unlike most sources. The first live sweep
    produced 53 items and auto-rejected NONE: this model returns 0.90 for
    almost every verdict on these titles, and the auto-reject bar is 0.95. The
    classifier's judgement was good (it flagged CBAM and dismissed one-minute
    speeches) but never confident enough to act on, so everything queued —
    ~640 items a year of clicking. Keywords derived from the profile's `eu`
    cluster cut the same part-session to 6 and still caught "Recommendation on
    EU-China political relations", the most valuable item on that agenda.
    The cost is real and accepted: a China-relevant item phrased without any
    of these words is auto-rejected without an LLM call. Prefilter rejections
    stay visible and overridable in the Journal, and a human override there
    feeds the classifier's few-shot loop — which is the designed remedy.
