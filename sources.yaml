    NPC Observer "Session Watch" posts (#37) — the authoritative English
    tracker announces each scheduled NPCSC session in a rigid sentence
    ("will convene for its 23rd session from June 23 to 26"); the parser
    extracts only that, so the item type is narrow and always relevant:
    whitelisted. Monthly "NPC Calendar" posts carry no day-level dates and
    are deliberately skipped. Feed window is 10 posts; sessions announce
    ~1 week ahead, the daily sweep is plenty.
    Tier 2, not 1 (#49): this is a regex over prose, not a structured feed,
    and the tier is a trust signal the dashboard shows. auto_accept stays —
    it is earned by how narrow the item type is, not by the tier.

- id: ep-plenary-ical
  tier: 1
  kind: ics
  url: "https://calendar.google.com/calendar/ical/c_44a34b65470fc449cb75b0cee40363953fd2e754f4599dd2a5be8695c923bc0d%40group.calendar.google.com/public/basic.ics"
